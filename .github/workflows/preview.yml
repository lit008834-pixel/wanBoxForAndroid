# @author 雾晚
name: Preview Build
on:
  push:
    branches:
      - beta1-1.15
  workflow_dispatch:
    inputs:

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/executableSo
          # @author 雾晚: share the verified cache for exactly the same core inputs.
          key: native-audit-${{ hashFiles('libcore/**', 'buildScript/lib/**', 'buildScript/init/**', 'nb4a.properties') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
      - name: Upload Root TUN executables
        uses: actions/upload-artifact@v4
        with:
          name: root-tun-executables
          path: app/executableSo
          if-no-files-found: error
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Download Root TUN executables
        uses: actions/download-artifact@v4
        with:
          name: root-tun-executables
          path: app/executableSo
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Prepare release signing key
        env:
          WANBOX_KEYSTORE_BASE64: ${{ secrets.WANBOX_KEYSTORE_BASE64 }}
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          test -n "$WANBOX_KEYSTORE_BASE64"
          test -n "$WANBOX_KEYSTORE_PASSWORD"
          printf '%s' "$WANBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wanbox-release.p12"
          test -s "$RUNNER_TEMP/wanbox-release.p12"
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANBOX_KEYSTORE_FILE: ${{ runner.temp }}/wanbox-release.p12
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          APK_DIR=app/build/outputs/apk/preview/release
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -d "$APK_DIR"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          PREVIEW_VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          PREVIEW_CODE=$(grep '^PRE_VERSION_CODE=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          FORMAL_CODE=$(grep '^VERSION_CODE=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          test "$PREVIEW_CODE" -gt "$FORMAL_CODE"
          PREVIEW_CODE=$((PREVIEW_CODE * 5))
          test "$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(grep -c 'android:targetPackage="com.lit008834.pixel.wanboxforandroid"' app/src/main/res/xml/shortcuts.xml)" -eq 4
          for apk in "$APK_DIR"/*.apk; do
            case "$(basename "$apk")" in wanBoxForAndroid-"$PREVIEW_VERSION"-*.apk) ;; *) exit 1 ;; esac
            python3 tools/verify_apk_abi.py "$apk"
            "$AAPT" dump badging "$apk" | grep -q "^package: name='com.lit008834.pixel.wanboxforandroid' versionCode='$PREVIEW_CODE' versionName='$PREVIEW_VERSION' "
            manifest=$($AAPT dump xmltree "$apk" AndroidManifest.xml)
            printf '%s\n' "$manifest" | grep -q 'com.lit008834.pixel.wanboxforandroid.cache'
            printf '%s\n' "$manifest" | grep -q 'io.nekohasekai.sagernet.widget.WidgetControlReceiver'
            signer_digest=$("$APKSIGNER" verify --verbose --print-certs "$apk" | grep -m1 -i 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr '[:lower:]' '[:upper:]')
            echo "$(basename "$apk") certificate SHA-256: $signer_digest"
            test "$signer_digest" = 'AEC62C7003FA515534817250D3CD0DC705E19F4CD578A7A9A1D22519596EA598'
          done
          mkdir -p public-apks
          cp "$APK_DIR"/*arm64-v8a*.apk public-apks/
          echo "APK=public-apks" >> "$GITHUB_ENV"
          # @author 雾晚: same source and signature, emulator-only ABI; never uploaded to Release.
          WANBOX_INTERNAL_TEST=1 ./gradlew app:assemblePreviewRelease -PwanboxInternalTestAbi=x86_64
          mkdir -p internal-apks
          cp "$APK_DIR"/*x86_64*.apk internal-apks/
          for fixture in internal-apks/*.apk; do "$APKSIGNER" verify "$fixture"; done
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
      - uses: actions/upload-artifact@v4
        with:
          name: internal-upgrade-fixture
          path: internal-apks/*.apk
          if-no-files-found: error
          retention-days: 1

  verify_upgrade:
    name: Verify preview updates in place
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-upgrade-fixture
          path: apks
      - name: Download previous wanBox releases and OwnBox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download v3.0.3 \
            -R lit008834-pixel/wanBoxForAndroid \
            -p wanBoxForAndroid-3.0.3-x86_64.apk -D previous
          gh release download v3.0.4-preview.1 \
            -R lit008834-pixel/wanBoxForAndroid \
            -p wanBoxForAndroid-3.0.4-preview.1-x86_64-release.apk -D previous
          gh release download v3.0.5 \
            -R lit008834-pixel/wanBoxForAndroid \
            -p wanBoxForAndroid-3.0.5-x86_64.apk -D previous
          gh release download v3.0.5-preview.2 \
            -R lit008834-pixel/wanBoxForAndroid \
            -p wanBoxForAndroid-3.0.5-preview.2-x86_64-release.apk -D previous
          echo '05abf838efc0be8781e52c0cf6e0393b023fd66ca80c4b88c6a71002d2274ed8  previous/wanBoxForAndroid-3.0.5-x86_64.apk' | sha256sum --check
          echo '8dba440911f90b60d94574d62c28ce20dbab80dded19a580142ddaf0413fc863  previous/wanBoxForAndroid-3.0.5-preview.2-x86_64-release.apk' | sha256sum --check
          # @author 雾晚: deleted v2.9.1-preview replaced by a pinned, verified co-install fixture.
          gh release download v3.0.0 \
            -R Own716/OwnBoxForAndroid \
            -p OwnBox-3.0.0-x86_64-release.apk -D previous
          echo '86062de59591df18cbd257e484f43e1a1483d961af3f793b4194ac019d618348  previous/OwnBox-3.0.0-x86_64-release.apk' | sha256sum --check
          echo '048d1792bfb8f2134fdd2f836f99cc85e8050a54920cbf99c1014f3f98331ba8  previous/wanBoxForAndroid-3.0.3-x86_64.apk' | sha256sum --check
          echo 'a0659bc001bb3dd3b7ac458b662418d72970a654363ca5df7a3a2f0e47a298e2  previous/wanBoxForAndroid-3.0.4-preview.1-x86_64-release.apk' | sha256sum --check
          # @author 雾晚: 该固定版本只用于临时模拟器验证，不修改上游或用户安装。
          OWNBOX=previous/OwnBox-3.0.0-x86_64-release.apk
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          test -s "$OWNBOX"
          "$AAPT" dump badging "$OWNBOX" | grep -q "^package: name='com.ownbox.app' "
          "$APKSIGNER" verify "$OWNBOX"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update installed wanBox beside OwnBox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: bash tools/diagnostics/verify_preview_upgrade.sh

  publish:
    name: Publish Preview Release
    runs-on: ubuntu-latest
    needs: verify_upgrade
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Version
        run: |
          VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "PREVIEW_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Prepare APKs
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/
          test "$(find apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          (cd apks && sha256sum *.apk > SHA256SUMS && sha256sum --check SHA256SUMS)
          CODE=$(grep '^PRE_VERSION_CODE=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          CODE=$((CODE * 5))
          cp PREVIEW_NOTES.md "$RUNNER_TEMP/preview-notes.md"
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PREVIEW_TAG }}
          target_commitish: ${{ github.sha }}
          name: wanBox ${{ env.PREVIEW_TAG }}
          body_path: ${{ runner.temp }}/preview-notes.md
          files: apks/*
          draft: false
          prerelease: true
          make_latest: false
