# @author 雾晚
name: Preview Build
on:
  push:
    branches:
      - beta1-1.15
  workflow_dispatch:
    inputs:

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/executableSo
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
      - name: Upload Root TUN executables
        uses: actions/upload-artifact@v4
        with:
          name: root-tun-executables
          path: app/executableSo
          if-no-files-found: error
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Download Root TUN executables
        uses: actions/download-artifact@v4
        with:
          name: root-tun-executables
          path: app/executableSo
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Prepare release signing key
        env:
          WANBOX_KEYSTORE_BASE64: ${{ secrets.WANBOX_KEYSTORE_BASE64 }}
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          test -n "$WANBOX_KEYSTORE_BASE64"
          test -n "$WANBOX_KEYSTORE_PASSWORD"
          printf '%s' "$WANBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wanbox-release.p12"
          test -s "$RUNNER_TEMP/wanbox-release.p12"
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANBOX_KEYSTORE_FILE: ${{ runner.temp }}/wanbox-release.p12
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          APK_DIR=app/build/outputs/apk/preview/release
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -d "$APK_DIR"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          PREVIEW_VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          PREVIEW_CODE=$(grep '^PRE_VERSION_CODE=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          FORMAL_CODE=$(grep '^VERSION_CODE=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          test "$PREVIEW_CODE" -gt "$FORMAL_CODE"
          PREVIEW_CODE=$((PREVIEW_CODE * 5))
          test "$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          test "$(grep -c 'android:targetPackage="com.lit008834.pixel.wanboxforandroid"' app/src/main/res/xml/shortcuts.xml)" -eq 4
          for apk in "$APK_DIR"/*.apk; do
            case "$(basename "$apk")" in wanBoxForAndroid-"$PREVIEW_VERSION"-*.apk) ;; *) exit 1 ;; esac
            unzip -Z1 "$apk" | grep -Eq '^lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/librootbox.so$'
            "$AAPT" dump badging "$apk" | grep -q "^package: name='com.lit008834.pixel.wanboxforandroid' versionCode='$PREVIEW_CODE' versionName='$PREVIEW_VERSION' "
            manifest=$($AAPT dump xmltree "$apk" AndroidManifest.xml)
            printf '%s\n' "$manifest" | grep -q 'com.lit008834.pixel.wanboxforandroid.cache'
            printf '%s\n' "$manifest" | grep -q 'com.lit008834.pixel.wanboxforandroid.widget.ACTION_TOGGLE'
            signer_digest=$("$APKSIGNER" verify --verbose --print-certs "$apk" | grep -m1 -i 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr '[:lower:]' '[:upper:]')
            echo "$(basename "$apk") certificate SHA-256: $signer_digest"
            test "$signer_digest" = 'AEC62C7003FA515534817250D3CD0DC705E19F4CD578A7A9A1D22519596EA598'
          done
          echo "APK=$APK_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}

  verify_upgrade:
    name: Verify preview updates in place
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: APKs
          path: apks
      - name: Download current formal release and OwnBox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download v3.0.2 \
            -R lit008834-pixel/wanBoxForAndroid \
            -p wanBoxForAndroid-3.0.2-x86_64.apk -D previous
          gh release download v2.9.1-preview \
            -R Own716/OwnBoxForAndroid \
            -p OwnBox-2.9.1-x86_64-release.apk -D previous
          echo '3458e7a32ecb7ca03cc6648dcfc3f6aabb06d8f5c7dfca81cdf823bff5dbfc23  previous/wanBoxForAndroid-3.0.2-x86_64.apk' | sha256sum --check
          echo 'ca90a54d76224e0a5a83fa670fc2aebd10d57689c8801efda0f3c8dddbc56586  previous/OwnBox-2.9.1-x86_64-release.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update installed wanBox beside OwnBox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: bash tools/diagnostics/verify_preview_upgrade.sh

  publish:
    name: Publish Preview Release
    runs-on: ubuntu-latest
    needs: verify_upgrade
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Version
        run: |
          VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "PREVIEW_TAG=v$VERSION-app-id.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Prepare APKs
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/
          test "$(find apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          (cd apks && sha256sum *.apk > SHA256SUMS && sha256sum --check SHA256SUMS)
          CODE=$(grep '^PRE_VERSION_CODE=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          CODE=$((CODE * 5))
          printf '# wanBox 预览版更新说明\n\n- 快捷设置磁贴单击恢复为开启或关闭代理连接；首次启用 VPN 时会请求系统授权。长按仍可进入“工具 → 自定义图标”（取决于系统是否支持磁贴偏好入口）。\n- 新增 Root TUN 模式：获得 Root 权限后由独立内核进程接管 TUN，无需启动 Android VPN 服务；未获得权限或启动失败时提示并切回 VPN 模式。\n- 保持独立包名 `com.lit008834.pixel.wanboxforandroid` 和原有正式签名；Android 版本号为 %s，可覆盖升级上一预览版，并与包名为 `com.ownbox.app` 的 OwnBox 2.9.1 共存。\n- 提供四种架构的签名 APK 与 SHA-256 校验文件。Root TUN 在不同 Root 管理器和厂商系统上的兼容性仍需设备验证。\n' "$CODE" > PREVIEW_NOTES.md
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PREVIEW_TAG }}
          target_commitish: ${{ github.sha }}
          name: wanBox ${{ env.PREVIEW_TAG }}
          body_path: PREVIEW_NOTES.md
          files: apks/*
          draft: false
          prerelease: true
          make_latest: false
