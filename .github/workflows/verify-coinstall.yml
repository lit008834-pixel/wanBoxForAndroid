# @author 雾晚
name: Verify OwnBox and wanBox coexist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coexist:
    name: Install both release APKs on Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download and identify the exact release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          gh release download v2.9.1-preview \
            -R Own716/OwnBoxForAndroid \
            -p OwnBox-2.9.1-x86_64-release.apk -D apks
          gh release download v3.0.1-app-id-preview.9 \
            -R lit008834-pixel/wanBoxForAndroid \
            -p wanBoxForAndroid-3.0.0.1-x86_64-release.apk -D apks
          echo 'c7b8acf33542006c7a866e148b7faf98bfe44742df96e73bc6d9f713024f0a3f  apks/OwnBox-2.9.1-x86_64-release.apk' | sha256sum --check
          echo '2adf8cc2d8868f74de1474caa95858c05757b9879d6b856039d1bcc5cf2dc7f4  apks/wanBoxForAndroid-3.0.0.1-x86_64-release.apk' | sha256sum --check
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging apks/OwnBox-2.9.1-x86_64-release.apk | grep -m1 "^package: name='com.ownbox.app' "
          "$AAPT" dump badging apks/wanBoxForAndroid-3.0.0.1-x86_64-release.apk | grep -m1 "^package: name='com.lit008834.pixel.wanboxforandroid' "

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, reinstall, and uninstall independently
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: bash tools/diagnostics/verify_coinstall.sh
