# @author 雾晚
name: Verify Android Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libcore:
    name: Build LibCore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ^1.25
      - name: Build native core
        run: ./run lib core
      - name: Test bounded URL probes and configuration templates
        run: |
          (cd libcore && go test ./internal/... ./protocol/urltest)
          python3 -m unittest discover -s tools -p test_clean_subscription.py
          go -C ../sing-box run ./cmd/sing-box check -c "$GITHUB_WORKSPACE/docs/config/local-proxy.json"
          go -C ../sing-box run ./cmd/sing-box check -c "$GITHUB_WORKSPACE/docs/config/tun-fakeip.json"
      - name: Verify native artifact
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v5
        with:
          name: root-tun-executables
          path: app/executableSo
          if-no-files-found: error
          retention-days: 1

  app:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: libcore-aar
          path: app/libs
      - uses: actions/download-artifact@v5
        with:
          name: root-tun-executables
          path: app/executableSo
      - name: Verify native artifact
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
      - name: Build app
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssDebug
      - name: Test complete unit suite and security contracts
        run: |
          ./gradlew app:testOssDebugUnitTest app:assembleOssDebugAndroidTest
          python3 tools/check_android_security.py
          bash tools/diagnostics/build_security_probe.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate database migrations, rollback and external control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: ./gradlew app:connectedOssDebugAndroidTest && bash tools/diagnostics/verify_external_control.sh
      - name: Preserve complete test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audit-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            probe/window.xml
