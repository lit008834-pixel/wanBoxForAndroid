# @author 雾晚
name: Release Build
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v3.0.0)"
        required: true
        default: "v3.0.1"

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v5
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download LibCore AAR
        uses: actions/download-artifact@v5
        with:
          name: libcore-aar
          path: app/libs
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Prepare release signing key
        env:
          WANBOX_KEYSTORE_BASE64: ${{ secrets.WANBOX_KEYSTORE_BASE64 }}
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          test -n "$WANBOX_KEYSTORE_BASE64"
          test -n "$WANBOX_KEYSTORE_PASSWORD"
          printf '%s' "$WANBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wanbox-release.p12"
          test -s "$RUNNER_TEMP/wanbox-release.p12"
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANBOX_KEYSTORE_FILE: ${{ runner.temp }}/wanbox-release.p12
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assembleOssRelease
          APK_DIR=app/build/outputs/apk/oss/release
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -d "$APK_DIR"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          VERSION_NAME=$(grep '^VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          VERSION_CODE=$(grep '^VERSION_CODE=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          VERSION_CODE=$((VERSION_CODE * 5))
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          test "$RELEASE_TAG" = "v$VERSION_NAME"
          test "$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          test "$(grep -c 'android:targetPackage="com.lit008834.pixel.wanboxforandroid"' app/src/main/res/xml/shortcuts.xml)" -eq 4
          for apk in "$APK_DIR"/*.apk; do
            case "$(basename "$apk")" in wanBoxForAndroid-"$VERSION_NAME"-*.apk) ;; *) exit 1 ;; esac
            "$AAPT" dump badging "$apk" | grep -q "^package: name='com.lit008834.pixel.wanboxforandroid' versionCode='$VERSION_CODE' versionName='$VERSION_NAME' "
            manifest=$($AAPT dump xmltree "$apk" AndroidManifest.xml)
            printf '%s\n' "$manifest" | grep -q 'com.lit008834.pixel.wanboxforandroid.cache'
            printf '%s\n' "$manifest" | grep -q 'com.lit008834.pixel.wanboxforandroid.widget.ACTION_TOGGLE'
            if ! verify_output=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1); then
              printf '%s\n' "$verify_output"
              exit 1
            fi
            printf '%s\n' "$verify_output"
            signer_digest=$(printf '%s\n' "$verify_output" | grep -m1 -i 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr '[:lower:]' '[:upper:]')
            echo "$(basename "$apk") certificate SHA-256: $signer_digest"
            test "$signer_digest" = 'AEC62C7003FA515534817250D3CD0DC705E19F4CD578A7A9A1D22519596EA598'
          done
          echo "APK=$APK_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: APKs
          path: app/build/outputs/apk/oss/release/*.apk
          if-no-files-found: warn

  verify_upgrade:
    name: Verify formal update beside OwnBox
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: APKs
          path: apks
      - name: Download previous preview and OwnBox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download v3.0.2-preview.1-app-id.10 \
            -R lit008834-pixel/wanBoxForAndroid \
            -p wanBoxForAndroid-3.0.2-preview.1-x86_64-release.apk -D previous
          gh release download v2.9.1-preview \
            -R Own716/OwnBoxForAndroid \
            -p OwnBox-2.9.1-x86_64-release.apk -D previous
          echo '9427370e3809e903ceae8dfa759bd85970aae36203442b04e1da6ee5686893fc  previous/wanBoxForAndroid-3.0.2-preview.1-x86_64-release.apk' | sha256sum --check
          echo 'c7b8acf33542006c7a866e148b7faf98bfe44742df96e73bc6d9f713024f0a3f  previous/OwnBox-2.9.1-x86_64-release.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update installed preview beside OwnBox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: bash tools/diagnostics/verify_formal_upgrade.sh

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: verify_upgrade
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: APKs
          path: artifacts
      - name: Prepare APKs
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/
          test "$(find apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          (cd apks && sha256sum *.apk > SHA256SUMS && sha256sum --check SHA256SUMS)
          cat apks/SHA256SUMS
      - name: Show Release Notes
        run: cat RELEASE_NOTES.md
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: wanBox ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: apks/*
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'preview') || contains(github.event.inputs.tag || github.ref_name, 'alpha') || contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          make_latest: ${{ !(contains(github.event.inputs.tag || github.ref_name, 'preview') || contains(github.event.inputs.tag || github.ref_name, 'alpha') || contains(github.event.inputs.tag || github.ref_name, 'beta')) }}
          generate_release_notes: false

